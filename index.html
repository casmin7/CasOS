<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CasOS</title>
    <link rel="stylesheet" href="style.css">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Alien+Block&family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=Saira:ital,wght@0,100..900;1,100..900&display=swap');
    </style>

</head>
<body>


    <div class="topbar">
        <div class="clock-container" style="margin: 0;">
            <p style="cursor: pointer; margin: 0;" id="appselect" class="clocklook">CasOS</p>
            <div id="appselect-panel" class="hidden">
                <div class="panel-section">
                    <div id="welcomeopen" class="openbuttons">
                        <img src="icons/info.svg" alt="Info Icon" class="battery-icon">Info
                    </div>
                    <div id="calcopen" class="openbuttons">
                        <img src="icons/calc.svg" alt="Calculator Icon" class="battery-icon">Calculator
                    </div>
                </div>
            </div>
        </div>
            <div class="clock-container" style="margin: 0;">
                 <p id="clock" class="clocklook" style="margin: 0;">
                    00:00
                 </p>

        <div id="clock-panel" class="hidden">
            <div class="panel-section">
                <h3>Calendar</h3>
                <p class="placeholder-text">No upcoming events</p>
            </div>
            <hr class="panel-divider">
            <div class="panel-section">
                <h3>Notifications</h3>
                <p class="placeholder-text">Clear as a bell!</p>
            </div>
        </div>
    </div>
            <div style="display: flex; align-items: center;" class="clocklook">
                <img src="https://www.svgrepo.com/show/509313/battery-charge.svg" alt="Battery Icon" class="battery-icon">
                100%
            </div>
    </div>


<div id="welcomescreen">
    <div id="welcomescreenheader">
        <div style="display: flex; align-items: center;">
            <img src="icons/info.svg" alt="Info Icon" class="battery-icon">Info
        </div>
        <p id="welcomeclose"></p>
    </div>
    
    <div class="window-body">
        <div class="forwindows">
            <img class="profile-pic" src="https://avatars.githubusercontent.com/u/81086112?v=4" alt="Profile Picture">
            
            <div class="info-text-side">
                <h2>Casmin7</h2>
                <p class="bio-text">This is CasOS, a webOS inspired by the guide provided by Stradance. It is WIP.</p>
                
                <div class="social-links">
                    <a href="https://www.instagram.com/casmin7_/" target="_blank" rel="noopener noreferrer">
                        <img src="icons/insta.svg" alt="Instagram" class="social-icon">
                    </a>
                    <a href="mailto:cosmin.ciurevici2017@gmail.com">
                        <img src="icons/email.svg" alt="Email" class="social-icon">
                    </a>
                    <a href="https://github.com/casmin7">
                        <img src="icons/github.svg" alt="Github" class="social-icon">
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="calcscreen">
    <div id="calcscreenheader">
        <div style="display: flex; align-items: center;">
            <img src="icons/calc.svg" alt="Info Icon" class="battery-icon">Calculator
        </div>
        <p id="calcclose"></p>
    </div>
    
    <div class="calc-body">
        <div class="calc-display">
            <div id="calc-history"></div>
            <div id="calc-input">0</div>
        </div>
        
        <div class="calc-grid">
            <button class="btn btn-op" onclick="clearCalc()">C</button>
            <button class="btn btn-op" onclick="appendOperator('/')">÷</button>
            <button class="btn btn-op" onclick="appendOperator('*')">×</button>
            <button class="btn btn-op" onclick="deleteLast()">⌫</button>

            <button class="btn" onclick="appendNumber('7')">7</button>
            <button class="btn" onclick="appendNumber('8')">8</button>
            <button class="btn" onclick="appendNumber('9')">9</button>
            <button class="btn btn-op" onclick="appendOperator('-')">−</button>

            <button class="btn" onclick="appendNumber('4')">4</button>
            <button class="btn" onclick="appendNumber('5')">5</button>
            <button class="btn" onclick="appendNumber('6')">6</button>
            <button class="btn btn-op" onclick="appendOperator('+')">+</button>

            <button class="btn" onclick="appendNumber('1')">1</button>
            <button class="btn" onclick="appendNumber('2')">2</button>
            <button class="btn" onclick="appendNumber('3')">3</button>
            <button class="btn btn-equals" onclick="calculateResult()">=</button>

            <button class="btn btn-zero" onclick="appendNumber('0')">0</button>
            <button class="btn" onclick="appendNumber('.')">.</button>
        </div>
    </div>
</div>




    <script src="scripts.js"></script>
</body>
</html>
