<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CasOS</title>
    <link rel="stylesheet" href="style.css">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Alien+Block&family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=Saira:ital,wght@0,100..900;1,100..900&display=swap');
    </style>

</head>
<body>


    <div class="topbar">
            <p style="cursor: pointer" id="welcomeopen" class="clocklook">CasOS</p>
            <div class="clock-container">
                 <p id="clock" class="clocklook">
                    00:00
                 </p>

        <div id="gnome-panel" class="hidden">
            <div class="panel-section">
                <h3>Calendar</h3>
                <p class="placeholder-text">No upcoming events</p>
            </div>
            <hr class="panel-divider">
            <div class="panel-section">
                <h3>Notifications</h3>
                <p class="placeholder-text">Clear as a bell!</p>
            </div>
        </div>
    </div>
            <div style="display: flex; align-items: center;" id="calcopen">
                <img src="https://www.svgrepo.com/show/509313/battery-charge.svg" alt="Battery Icon" class="battery-icon">
                100%
            </div>
    </div>


    <div id="welcomescreen">
         <div id="welcomeheader">Welcome to CasOS
            <p style="cursor: pointer" id="welcomeclose"></p>

         </div>
    <div style="background-color: #fff;">
        <p style="color: #000;">Hello World</p>
    </div>
    </div>

     <div id="calcscreen">
         <div id="calcheader">Calculator
            <p style="cursor: pointer" id="calcclose"></p>

         </div>
    <div style="background-color: #fff;">
        <p style="color: #000;">Hello World</p>
    </div>
    </div>




    <script src="scripts.js"></script>
</body>
</html>
